security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\UserAuthenticator
            user_checker: App\Security\UserChecker
            logout:
                path: app_logout
                # where to redirect after logout
                # target: app_any_route

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }
            - { path: ^/login, roles: PUBLIC_ACCESS }

            - { path: ^/admin, roles: ROLE_ADMIN }

            - { path: ^/production/dtf, roles: ROLE_MACHINISTE_DTF }
            - { path: ^/production/tracer, roles: ROLE_MACHINISTE_TRACER }
            - { path: ^/production/reprographie, roles: ROLE_REPROGRAPHIE }
            - { path: ^/production/graphisme, roles: ROLE_GRAPHISME }
            - { path: ^/production/prepresse, roles: ROLE_PREPRESSE }
            - { path: ^/production/finition, roles: ROLE_FINITION }

            - { path: ^/commercial, roles: ROLE_RESPONSABLE_COMMERCIAL }
            - { path: ^/gestion, roles: ROLE_RESPONSABLE_GESTION }
            - { path: ^/rh, roles: ROLE_RESPONSABLE_RH }

            - { path: ^/, roles: ROLE_USER }


    role_hierarchy:
       

        ROLE_ADMIN:
            - ROLE_USER
            - ROLE_RESPONSABLE_PRODUCTION
            - ROLE_RESPONSABLE_COMMERCIAL
            - ROLE_RESPONSABLE_GESTION
            - ROLE_RESPONSABLE_RH

        ROLE_RESPONSABLE_PRODUCTION:
            - ROLE_GRAPHISME
            - ROLE_PREPRESSE
            - ROLE_MACHINISTE_DTF
            - ROLE_MACHINISTE_TRACER
            - ROLE_REPROGRAPHIE
            - ROLE_FINITION

        ROLE_RESPONSABLE_COMMERCIAL:
            - ROLE_DEVIS
            - ROLE_COMMANDE
            - ROLE_RELATION_CLIENT

        ROLE_RESPONSABLE_GESTION:
            - ROLE_CAISSE
            - ROLE_STOCK
            - ROLE_ACHAT
            - ROLE_COMPTABILITE
            - ROLE_LOGISTIQUE

        ROLE_RESPONSABLE_RH:
            - ROLE_EMPLOYES
            - ROLE_PAIE

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
