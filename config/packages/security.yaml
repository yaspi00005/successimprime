security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\UserAuthenticator
            user_checker: App\Security\UserChecker

            logout:
                path: app_logout

    access_control:
        # Accès public
        - { path: ^/login, roles: PUBLIC_ACCESS }

        # Administration
        - { path: ^/admin, roles: ROLE_ADMIN }

        # Rubrique personnelle de l’assistante commerciale
        - { path: ^/assistante, roles: ROLE_ASSISTANTE_COMMERCIALE }
        - { path: ^/gestion, roles: ROLE_RESPONSABLE_GESTION }

        # Production
        - { path: ^/production/dtf, roles: ROLE_MACHINISTE_DTF }
        - { path: ^/production/tracer, roles: ROLE_MACHINISTE_TRACER }
        - { path: ^/production/reprographie, roles: ROLE_REPROGRAPHIE }
        - { path: ^/production/graphisme, roles: ROLE_GRAPHISME }
        - { path: ^/production/prepresse, roles: ROLE_PREPRESSE }
        - { path: ^/production/finition, roles: ROLE_FINITION }

        # Partie commerciale accessible au responsable
        # et à l’assistante commerciale
        - {
            path: ^/commercial,
            roles: [
                ROLE_RESPONSABLE_COMMERCIAL,
                ROLE_ASSISTANTE_COMMERCIALE
            ]
        }

        # Gestion et ressources humaines
        - { path: ^/gestion, roles: ROLE_RESPONSABLE_GESTION }
        - { path: ^/rh, roles: ROLE_RESPONSABLE_RH }

        # Toutes les autres pages nécessitent une connexion
        - { path: ^/, roles: ROLE_USER }

    role_hierarchy:
        ROLE_ADMIN:
            - ROLE_USER
            - ROLE_RESPONSABLE_PRODUCTION
            - ROLE_RESPONSABLE_COMMERCIAL
            - ROLE_ASSISTANTE_COMMERCIALE
            - ROLE_RESPONSABLE_GESTION
            - ROLE_RESPONSABLE_RH

        ROLE_RESPONSABLE_PRODUCTION:
            - ROLE_USER
            - ROLE_GRAPHISME
            - ROLE_PREPRESSE
            - ROLE_MACHINISTE_DTF
            - ROLE_MACHINISTE_TRACER
            - ROLE_REPROGRAPHIE
            - ROLE_FINITION

        ROLE_RESPONSABLE_COMMERCIAL:
            - ROLE_USER
            - ROLE_DEVIS
            - ROLE_COMMANDE
            - ROLE_CLIENT
            - ROLE_RELATION_CLIENT
            - ROLE_PAIEMENT

        ROLE_ASSISTANTE_COMMERCIALE:
            - ROLE_USER
            - ROLE_DEVIS
            - ROLE_COMMANDE
            - ROLE_CLIENT
            - ROLE_RELATION_CLIENT
            - ROLE_PAIEMENT
            - ROLE_SAISIE_TRESORERIE

        ROLE_RESPONSABLE_GESTION:
            - ROLE_USER
            - ROLE_CAISSE
            - ROLE_STOCK
            - ROLE_ACHAT
            - ROLE_COMPTABILITE
            - ROLE_LOGISTIQUE
            - ROLE_SAISIE_TRESORERIE
            - ROLE_VOIR_SOLDES_TRESORERIE
            - ROLE_TRANSFERT_TRESORERIE

        ROLE_RESPONSABLE_RH:
            - ROLE_USER
            - ROLE_EMPLOYES
            - ROLE_PAIE

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10